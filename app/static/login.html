<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Klip</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:      #0d1117;
            --surface: #161b22;
            --border:  #30363d;
            --text:    #e6edf3;
            --muted:   #7d8590;
            --accent:  #4493f8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo img {
            height: 44px;
            width: 44px;
            border-radius: 50%;
        }
        .logo span {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -.3px;
        }

        .tagline {
            font-size: 0.88rem;
            color: var(--muted);
            text-align: center;
            line-height: 1.6;
        }

        hr {
            width: 100%;
            border: none;
            border-top: 1px solid var(--border);
        }

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: #fff;
            color: #3c4043;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 11px 16px;
            font-size: 0.92rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: box-shadow .15s;
        }
        .btn-google:hover { box-shadow: 0 2px 8px rgba(0,0,0,.35); }

        .btn-guest {
            display: block;
            width: 100%;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 0.88rem;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: border-color .15s, color .15s;
        }
        .btn-guest:hover { border-color: var(--accent); color: var(--text); }

        .note {
            font-size: 0.75rem;
            color: var(--muted);
            text-align: center;
            line-height: 1.7;
        }
        .note strong { color: var(--text); font-weight: 500; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <img src="https://storage.googleapis.com/klip-static/klip_avatar_512.gif" alt="Klip">
        <span>Klip</span>
    </div>

    <p class="tagline">Your AI assistant</p>

    <hr>

    <a class="btn-google" href="/login/google">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
        Sign in with Google
    </a>

    <a class="btn-guest" href="/guest">Continue as guest</a>

    <p class="note">
        <strong>Signed in:</strong> {{USER_LIMIT}} messages/day &nbsp;·&nbsp;
        <strong>Guest:</strong> {{GUEST_LIMIT}} messages/day<br>
        Guest history is not saved between sessions.
    </p>
</div>
</body>
</html>
