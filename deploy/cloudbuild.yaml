steps:
  # Pull the previous image to use as a build cache (fails silently on first build)
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-c', 'docker pull $_IMAGE || true']

  # Build with cache-from so unchanged layers (e.g. pip install) are reused
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from=$_IMAGE
      - -t=$_IMAGE
      - .

  - name: gcr.io/cloud-builders/docker
    args: [push, '$_IMAGE']

options:
  logging: CLOUD_LOGGING_ONLY
